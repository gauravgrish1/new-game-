<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My To-Do List</title>
	<style>
		:root { --ink: #24303a; --muted: #71808a; --paper: #fffdf8; --line: #e4e8e7; --accent: #247b78; --danger: #c94c4c; }
		* { box-sizing: border-box; }
		body { margin: 0; 
            min-height: 100vh;
             padding: 32px 16px;
              color: var(--ink);
               background: #e8f0ed;
                font-family: Arial, sans-serif; }g
		.app { width: min(620px, 100%);
             margin: auto; 
             padding: clamp(24px, 6vw, 48px);
              background: var(--paper);
               border: 1px solid #d9e1de;
                box-shadow: 10px 10px 0 #c8d8d2; }
		h1 { margin: 0 0 8px;
             font-size: clamp(2rem, 7vw, 3.5rem); }
		.subtitle { margin: 0 0 28px;
             color: var(--muted); }
		form { display: flex;
             gap: 8px; 
             margin-bottom: 22px; }
		input[type="text"] { min-width: 0;
             flex: 1;
              padding: 13px;
               border: 1px solid #bfcac7; 
               color: var(--ink);
                font-size: 1rem; }
		input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
		button { border: 0; cursor: pointer; font-weight: 700; }
		.add { padding: 0 18px; color: #fff; background: var(--accent); }
		.add:hover { background: #1b615f; }
		.status { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
		ul { list-style: none; margin: 0; padding: 0; }
		li { display: flex; align-items: center; gap: 10px; min-height: 58px; border-top: 1px solid var(--line); }
		label { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
		input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
		.task { overflow-wrap: anywhere; }
		li.done .task { color: var(--muted); text-decoration: line-through; }
		.actions { display: flex; gap: 2px; }
		.actions button { padding: 7px 9px; color: var(--muted); background: transparent; font-size: 1rem; }
		.actions button:hover:not(:disabled) { color: var(--accent); background: #e8f0ed; }
		.actions .delete:hover { color: var(--danger); background: #faeeee; }
		.actions button:disabled { cursor: not-allowed; opacity: .25; }
		.empty { padding: 28px 0; color: var(--muted); text-align: center; font-style: italic; }
		@media (max-width: 480px) { form { flex-direction: column; } .add { min-height: 44px; } li { align-items: flex-start; padding: 13px 0; } .actions { margin-left: 28px; } }
	</style>
</head>
<body>
	<main class="app">
		<h1>My To-Do List</h1>
		<p class="subtitle">Keep track of what matters today.</p>

		<form id="todo-form">
			<input id="todo-input" type="text" placeholder="Enter a task..." aria-label="New task" autocomplete="off">
			<button class="add" type="submit">Add task</button>
		</form>

		<div class="status"><span id="total">0 tasks</span><span id="finished">0 complete</span></div>
		<ul id="todo-list"></ul>
	</main>

	<script>
		const form = document.querySelector('#todo-form');
		const input = document.querySelector('#todo-input');
		const list = document.querySelector('#todo-list');
		const total = document.querySelector('#total');
		const finished = document.querySelector('#finished');
		let todos = [];

		function render() {
			list.innerHTML = '';
			todos.forEach((todo, index) => {
				const item = document.createElement('li');
				if (todo.done) item.classList.add('done');
				item.innerHTML = `<label><input type="checkbox" aria-label="Complete task" ${todo.done ? 'checked' : ''}><span class="task"></span></label><div class="actions"><button type="button" data-action="up" aria-label="Move task up" ${index === 0 ? 'disabled' : ''}>↑</button><button type="button" data-action="down" aria-label="Move task down" ${index === todos.length - 1 ? 'disabled' : ''}>↓</button><button class="delete" type="button" data-action="delete" aria-label="Delete task">×</button></div>`;
				item.querySelector('.task').textContent = todo.text;
				item.querySelector('input').addEventListener('change', () => { todo.done = !todo.done; render(); });
				item.querySelectorAll('button').forEach(button => button.addEventListener('click', () => moveTodo(index, button.dataset.action)));
				list.appendChild(item);
			});
			if (!todos.length) list.innerHTML = '<li class="empty">No tasks yet. Add one above.</li>';
			const complete = todos.filter(todo => todo.done).length;
			total.textContent = `${todos.length} ${todos.length === 1 ? 'task' : 'tasks'}`;
			finished.textContent = `${complete} complete`;
		}

		function moveTodo(index, action) {
			if (action === 'delete') todos.splice(index, 1);
			if (action === 'up' && index > 0) [todos[index - 1], todos[index]] = [todos[index], todos[index - 1]];
			if (action === 'down' && index < todos.length - 1) [todos[index], todos[index + 1]] = [todos[index + 1], todos[index]];
			render();
		}

		form.addEventListener('submit', event => {
			event.preventDefault();
			const text = input.value.trim();
			if (!text) return;
			todos.push({ text, done: false });
			input.value = '';
			render();
			input.focus();
		});

		render();
	</script>
</body>
</html>
